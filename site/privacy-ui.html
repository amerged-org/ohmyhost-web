<style>
  #cookie-notice {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 45;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    max-width: calc(100% - 24px);
    border: 1px solid var(--border-strong, #26282c);
    border-radius: 10px;
    background: var(--card, #0a0b0d);
    color: var(--muted-foreground, #83878d);
    font: 12px/1.45 var(--sans, system-ui);
  }
  #cookie-notice[hidden] {
    display: none;
  }
  #cookie-notice a {
    color: var(--foreground, #f0f1f2);
    text-decoration: underline;
  }
  #cookie-dismiss {
    background: none;
    border: 1px solid var(--border-strong, #26282c);
    border-radius: 6px;
    color: var(--foreground, #f0f1f2);
    padding: 4px 8px;
    font: inherit;
    cursor: pointer;
  }
  .contact-form label {
    display: block;
    margin: 18px 0 7px;
    color: var(--foreground);
  }
  .contact-form input,
  .contact-form textarea {
    display: block;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--r-sm, 12px);
    background: var(--muted);
    color: var(--foreground);
    font: inherit;
  }
  .contact-form textarea {
    resize: vertical;
  }
  .contact-form button {
    margin-top: 10px;
  }
  .contact-form[hidden] {
    display: none;
  }
  @media print {
    nav,
    footer,
    #cookie-notice,
    dialog {
      display: none !important;
    }
    .docs-content {
      max-width: none;
      margin: 0;
    }
    body {
      background: #fff !important;
      color: #000 !important;
    }
    .docs-content p,
    .docs-content li,
    .docs-content h1,
    .docs-content h2 {
      color: #000 !important;
      background: none !important;
      -webkit-text-fill-color: #000 !important;
    }
  }
</style>
<aside id="cookie-notice" aria-label="Cookie information" hidden>
  <span>Only technical cookies. <a href="/cookies">Details</a></span
  ><button id="cookie-dismiss" type="button">OK</button>
</aside>

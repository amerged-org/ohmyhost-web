<dialog id="beta-modal" aria-labelledby="beta-title" style="margin:auto;padding:30px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--card);color:var(--foreground);max-width:440px;width:calc(100% - 32px)">
  <button type="button" id="beta-close" aria-label="Close" style="float:right;background:none;border:0;color:var(--muted-foreground);font:24px var(--sans);cursor:pointer">×</button>
  <h2 id="beta-title" style="text-align:left;font-size:28px">Get beta access</h2>
  <p style="color:var(--muted-foreground);line-height:1.6;margin-top:14px">Register your interest in ohmyho.st.</p>
  <form id="beta-form" style="margin-top:22px">
    <label for="beta-email">Email</label>
    <input id="beta-email" name="email" type="email" autocomplete="email" maxlength="254" required style="display:block;width:100%;padding:12px;margin:8px 0 18px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--background);color:var(--foreground);font:inherit">
    <label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.6"><input id="beta-consent" name="consent" type="checkbox" required style="margin-top:4px"><span>I agree that amerged B.V. may store my email to register my interest in the ohmyho.st beta. <a href="/privacy" style="text-decoration:underline">Privacy</a></span></label>
    <button class="btn nochev" id="beta-submit" type="submit" style="margin-top:22px">Register interest</button>
  </form>
  <p id="beta-message" role="status" aria-live="polite" style="font-size:14px;line-height:1.6;margin-top:16px"></p>
</dialog>
<style>#beta-modal::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(5px)}</style>

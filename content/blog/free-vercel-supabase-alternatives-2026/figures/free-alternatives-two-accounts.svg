<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The usual free stack is Vercel Hobby for the app, personal use only, plus Supabase Free for the database, which pauses when quiet. One free plan for app and Postgres means one account and one set of limits.">
  <rect width="1200" height="675" fill="#000"/>
  <g font-family="'JetBrains Mono', monospace" font-size="26" fill="#83878D">
    <text x="50" y="130">The usual free stack</text>
    <text x="630" y="130">One free plan</text>
  </g>
  <g fill="#0A0B0D" stroke="#26282C" stroke-width="2">
    <rect x="50" y="160" width="520" height="180" rx="18"/>
    <rect x="50" y="360" width="520" height="180" rx="18"/>
    <rect x="630" y="160" width="520" height="380" rx="18" stroke="#83878D"/>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="40" fill="#F0F1F2">
    <text x="90" y="240">Vercel Hobby</text>
    <text x="90" y="440">Supabase Free</text>
    <text x="670" y="330">App + Postgres</text>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="24" fill="#83878D">
    <text x="90" y="290">app · personal use only</text>
    <text x="90" y="490">database · pauses when quiet</text>
    <text x="670" y="380">one account</text>
    <text x="670" y="416">one set of limits</text>
  </g>
</svg>

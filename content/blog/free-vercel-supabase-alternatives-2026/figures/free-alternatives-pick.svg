<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pick a free plan by need: app plus Postgres on one account, ohmyho.st; an edge app where SQLite is fine, Cloudflare; only a database, Neon or Supabase; a personal project, Vercel Hobby with Neon.">

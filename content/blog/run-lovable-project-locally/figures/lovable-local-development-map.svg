<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Source files from GitHub run on your local computer. The browser and app code still connect to hosted authentication, database and file services. Running locally does not move your backend.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#83878D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#000"/>
  <g font-family="'Space Grotesk', sans-serif">
    <text x="70" y="96" font-size="48" font-weight="700" fill="#F0F1F2">Local app. Hosted backend.</text>
    <text x="70" y="145" font-size="28" font-weight="500" fill="#83878D">Running locally does not move your backend.</text>
  </g>
  <g fill="#0A0B0D" stroke="#26282C" stroke-width="2">
    <rect x="70" y="210" width="435" height="300" rx="18" stroke="#83878D"/>
    <rect x="740" y="210" width="390" height="300" rx="18"/>
    <rect x="102" y="307" width="371" height="68" rx="12"/>
    <rect x="102" y="397" width="371" height="68" rx="12"/>
    <rect x="772" y="307" width="326" height="142" rx="12"/>
    <rect x="70" y="568" width="435" height="65" rx="12"/>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F0F1F2">
    <text x="102" y="268">Local computer</text>
    <text x="772" y="268">Hosted services</text>
  </g>
  <g fill="none" stroke="#83878D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="124" y="327" width="34" height="27" rx="4"/>
    <path d="M124 336 H158"/>
    <path d="M135 421 L126 431 L135 441 M148 421 L157 431 L148 441"/>
    <path d="M526 337 H715" marker-end="url(#arrow)"/>
    <path d="M715 421 H526" marker-end="url(#arrow)"/>
    <path d="M287 559 V523" marker-end="url(#arrow)"/>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="27" fill="#F0F1F2">
    <text x="180" y="350">Browser</text>
    <text x="180" y="440" font-size="24">App code + dev server</text>
    <text x="798" y="345">Auth</text>
    <text x="798" y="387">Database</text>
    <text x="798" y="429">Files</text>
    <text x="102" y="610">GitHub repository</text>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#83878D">
    <text x="620" y="318" text-anchor="middle">API requests</text>
    <text x="620" y="459" text-anchor="middle">responses</text>
    <text x="473" y="608" text-anchor="end">source</text>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-size="25" font-weight="500" fill="#83878D">
    <text x="740" y="580">Existing services stay remote</text>
    <text x="740" y="616">unless you migrate them.</text>
  </g>
</svg>

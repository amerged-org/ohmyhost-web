<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="In Lovable one credit balance pays for building, hosting and in-app AI. With your own LLM, your LLM plan pays for building and ohmyho.st credits pay for running the app.">
  <rect width="1200" height="675" fill="#000"/>
  <g font-family="'JetBrains Mono', monospace" font-size="26" fill="#83878D">
    <text x="50" y="130">In Lovable</text>
    <text x="630" y="130">With your own LLM</text>
  </g>
  <g fill="#0A0B0D" stroke="#26282C" stroke-width="2">
    <rect x="50" y="160" width="520" height="380" rx="18"/>
    <rect x="630" y="160" width="520" height="180" rx="18" stroke="#83878D"/>
    <rect x="630" y="360" width="520" height="180" rx="18" stroke="#83878D"/>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="40" fill="#F0F1F2">
    <text x="90" y="310">One credit balance</text>
    <text x="670" y="240">Your LLM plan</text>
    <text x="670" y="440">ohmyho.st credits</text>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="26" fill="#83878D">
    <text x="90" y="380">pays for building,</text>
    <text x="90" y="420">hosting and in-app AI</text>
    <text x="670" y="290">pays for building</text>
    <text x="670" y="490">pays for running</text>
  </g>
</svg>

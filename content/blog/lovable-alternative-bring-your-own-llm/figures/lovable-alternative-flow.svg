<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A Lovable project goes to a private GitHub repository, your own coding agent (Claude Code, Codex, Cursor or Grok Build) works on it with your own LLM plan, and ohmyho.st hosts it on a Dev and a Prod URL.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0F1F2" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#F0F1F2" stop-opacity="0"/>
    </radialGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#83878D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#000"/>
  <ellipse cx="940" cy="525" rx="520" ry="330" fill="url(#glow)"/>

  <text x="80" y="104" font-family="'JetBrains Mono', monospace" font-size="20" fill="#83878D">lovable alternative · bring your own llm</text>
  <text x="80" y="190" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="68" fill="#F0F1F2" letter-spacing="-1.5">Keep the repo. Bring your own LLM.</text>
  <text x="80" y="246" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="27" fill="#83878D">Build with the agent you already pay for. Let it deploy to ohmyho.st.</text>

  <g fill="none" stroke="#3E4247" stroke-width="2">
    <path d="M334 525 H404" marker-end="url(#head)"/>
    <path d="M684 525 H754" marker-end="url(#head)"/>
    <path d="M1124 525 H1194" marker-end="url(#head)"/>
  </g>

  <!-- 01 Lovable -->
  <rect x="80" y="455" width="250" height="140" rx="16" fill="#0A0B0D" stroke="#26282C" stroke-width="2"/>
  <text x="108" y="494" font-family="'JetBrains Mono', monospace" font-size="16" fill="#83878D">01 · build</text>
  <text x="108" y="542" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F0F1F2">Lovable</text>
  <text x="108" y="575" font-family="'JetBrains Mono', monospace" font-size="15" fill="#83878D">prompt · preview</text>

  <!-- 02 GitHub -->
  <rect x="410" y="455" width="270" height="140" rx="16" fill="#0A0B0D" stroke="#26282C" stroke-width="2"/>
  <text x="438" y="494" font-family="'JetBrains Mono', monospace" font-size="16" fill="#83878D">02 · export</text>
  <text x="438" y="542" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F0F1F2">GitHub</text>
  <text x="438" y="575" font-family="'JetBrains Mono', monospace" font-size="15" fill="#83878D">private · two-way sync</text>

  <!-- 03 Your agent -->
  <rect x="760" y="330" width="360" height="390" rx="18" fill="#0A0B0D" stroke="#83878D" stroke-width="2"/>
  <text x="790" y="372" font-family="'JetBrains Mono', monospace" font-size="16" fill="#83878D">03 · your agent</text>
  <text x="790" y="420" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F0F1F2">Your LLM</text>
  <g font-family="'JetBrains Mono', monospace" font-size="17">
    <rect x="790" y="446" width="300" height="50" rx="10" fill="#000" stroke="#26282C" stroke-width="2"/>
    <text x="810" y="477" fill="#F0F1F2">claude code</text>
    <rect x="790" y="506" width="300" height="50" rx="10" fill="#000" stroke="#26282C" stroke-width="2"/>
    <text x="810" y="537" fill="#F0F1F2">codex</text>
    <rect x="790" y="566" width="300" height="50" rx="10" fill="#000" stroke="#26282C" stroke-width="2"/>
    <text x="810" y="597" fill="#F0F1F2">cursor</text>
    <rect x="790" y="626" width="300" height="50" rx="10" fill="#000" stroke="#26282C" stroke-width="2"/>
    <text x="810" y="657" fill="#F0F1F2">grok build</text>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#83878D" text-anchor="end">
    <text x="1072" y="476">pro · max · api</text>
    <text x="1072" y="536">chatgpt · api</text>
    <text x="1072" y="596">plan · own keys</text>
    <text x="1072" y="656">supergrok</text>
  </g>

  <!-- 04 ohmyho.st -->
  <rect x="1200" y="440" width="320" height="170" rx="18" fill="#0A0B0D" stroke="#26282C" stroke-width="2"/>
  <text x="1228" y="479" font-family="'JetBrains Mono', monospace" font-size="16" fill="#83878D">04 · host</text>
  <path d="M30 87 H14 L27 63 A31 31 0 1 1 73 63 L86 87 H70" transform="translate(1226 497) scale(.44)" fill="none" stroke="#F0F1F2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1280" y="533" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F0F1F2">ohmyho.st</text>
  <text x="1228" y="584" font-family="'JetBrains Mono', monospace" font-size="15" fill="#83878D">hosting · postgres · mail</text>

  <g fill="none" stroke="#3E4247" stroke-width="2">
    <path d="M1250 612 V668 H1272"/>
    <path d="M1250 668 V716 H1272"/>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="15">
    <text x="1284" y="673" fill="#83878D">dev</text>
    <text x="1330" y="673" fill="#F0F1F2">dev-app.check.omh.st</text>
    <text x="1284" y="721" fill="#83878D">prod</text>
    <text x="1330" y="721" fill="#F0F1F2">app.check.omh.st</text>
  </g>

  <line x1="80" y1="800" x2="1520" y2="800" stroke="#17181A" stroke-width="2"/>
  <path d="M30 87 H14 L27 63 A31 31 0 1 1 73 63 L86 87 H70" transform="translate(80 822) scale(.3)" fill="none" stroke="#83878D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="848" font-family="'JetBrains Mono', monospace" font-size="17" fill="#83878D">ohmyho.st</text>
  <text x="1520" y="848" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="17" fill="#3E4247">github is the only deployment source</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Paste one prompt into Claude Code, Codex, Cursor or Grok Build; you approve the sign-in, GitHub and secrets; the agent returns a Dev URL and then the live Prod URL.">

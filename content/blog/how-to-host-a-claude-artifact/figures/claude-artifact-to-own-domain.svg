<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A Claude artifact on claude.ai is exported by your agent into a project, checked as a preview in Dev and then published in Prod on your own domain.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#83878D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#000"/>
  <g fill="#0A0B0D" stroke="#26282C" stroke-width="2">
    <rect x="70" y="205" width="250" height="260" rx="18"/>
    <rect x="475" y="205" width="250" height="260" rx="18"/>
    <rect x="880" y="205" width="250" height="260" rx="18" stroke="#83878D"/>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="38" fill="#F0F1F2">
    <text x="102" y="285">Claude</text>
    <text x="102" y="330">artifact</text>
    <text x="507" y="285">Project</text>
    <text x="507" y="330">in Dev</text>
    <text x="912" y="285">Your</text>
    <text x="912" y="330">domain</text>
  </g>
  <g font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="26" fill="#83878D">
    <text x="102" y="410">claude.ai link</text>
    <text x="507" y="410">preview URL</text>
    <text x="912" y="410">Prod</text>
  </g>
  <g fill="none" stroke="#83878D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 335 H453" marker-end="url(#arrow)"/>
    <path d="M747 335 H858" marker-end="url(#arrow)"/>
  </g>
  <g font-family="'JetBrains Mono', monospace" font-size="24" fill="#83878D" text-anchor="middle">
    <text x="398" y="310">export</text>
    <text x="803" y="310">publish</text>
  </g>
</svg>
